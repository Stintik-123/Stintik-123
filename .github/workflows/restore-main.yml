name: restore-main
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore main.js with mobile no-WebGL
        run: |
          curl -sL "https://raw.githubusercontent.com/Stintik-123/Stintik-123/24b796b85715bcaa41c9582091228fedaa9db95a/js/main.js" -o js/main.js
          python3 << 'PY'
          from pathlib import Path
          c = Path("js/main.js").read_text(encoding="utf-8")
          old = "const scene = initScene();\ninitFx();\nconst mesh = initMesh();\n\nif (!okGsap || reduce) {"
          new = """const wantGL = !reduce && !isMob() && typeof WebGLRenderingContext !== 'undefined';
const scene = wantGL ? initScene() : null;
initFx();
const mesh = wantGL ? initMesh() : null;
if (!wantGL) {
  const gl = $('#gl'), meshEl = $('#mesh');
  if (gl) gl.remove();
  if (meshEl) meshEl.remove();
  document.body.classList.add('no-gl');
}

if (!okGsap || reduce) {"""
          if old not in c:
              raise SystemExit("pattern not found")
          c = c.replace(old, new, 1)
          Path("js/main.js").write_text(c, encoding="utf-8")
          print("patched", len(c))
          PY
          rm -f js/main.part0.js js/main.part1.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A js/
          git commit -m "perf: restore full main.js with mobile no-WebGL" || echo "nothing to commit"
          git push
